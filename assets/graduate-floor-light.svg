<text x="24" y="432" font-size="11.5" fill="#818b98">Source: Kementerian Pendidikan Tinggi, Laporan Kajian Pengesanan Graduan 2024, Jadual 4o. Fields with 1,000 or more respondents.</text>
<text x="24" y="448" font-size="11.5" fill="#818b98">Each field’s published income bands are rescaled to sum to 100% before adding the bands up to RM2,500.</text>
