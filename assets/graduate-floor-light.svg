<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" width="880" height="464" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Share of 2024 first-degree graduates earning RM2,500 a month or less, by field of study</title>
<desc id="d">Education 77.2 per cent; Arts and humanities 75 per cent; Agriculture, forestry, fisheries and veterinary 73.3 per cent; Services 59.9 per cent; Natural sciences, mathematics and statistics 58.1 per cent; Social sciences, journalism and information 52.5 per cent; Business, administration and law 47.5 per cent; Engineering, manufacturing and construction 39.6 per cent; Health and welfare 39.4 per cent; Information and communication technologies 27.7 per cent. All first-degree graduates: 49.7 per cent.</desc>
