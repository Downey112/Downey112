name: Metrics
on:
  schedule: [{ cron: "0 16 * * *" }] # 00:00 Malaysia time
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook, vbscript, powershell, shell, batchfile
          plugin_languages_limit: 4
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_lines_skipped: wealthwatch
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30
